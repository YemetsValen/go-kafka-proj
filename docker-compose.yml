services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wildlife
      POSTGRES_PASSWORD: wildlife
      POSTGRES_DB: wildlife
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildlife -d wildlife"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- application services (built from Dockerfile) ----
  # Enable with `docker compose --profile app up --build`.
  server:
    build:
      context: .
      target: server
    profiles: ["app"]
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"   # HTTP
      - "9090:9090"   # gRPC
      - "9100:9100"   # /metrics
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      METRICS_ADDR: ":9100"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC: "wildlife.sightings"
      DATABASE_URL: "postgres://wildlife:wildlife@postgres:5432/wildlife?sslmode=disable"
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"
      AUTH_API_KEYS: "dev"

  consumer:
    build:
      context: .
      target: consumer
    profiles: ["app"]
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "9101:9100"   # /metrics on a different host port
    environment:
      METRICS_ADDR: ":9100"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC: "wildlife.sightings"
      KAFKA_CONSUMER_GROUP: "wildlife-sightings-consumer"
      DATABASE_URL: "postgres://wildlife:wildlife@postgres:5432/wildlife?sslmode=disable"
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"

  # Optional OpenTelemetry collector for local tracing — enable with
  # `docker compose --profile otel up`.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    profiles: ["otel"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4318:4318"  # OTLP HTTP
      - "4317:4317"  # OTLP gRPC

volumes:
  postgres_data:
